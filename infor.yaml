  map_count: 2
  status: FEASIBILITY_AND_CLASSIFICATION_CHALLENGE
  qualification: Not every plane cut yields two tetrahedra; pieces with more than four extreme points
    rule out a single affine image.
  canonical_subproblem: Plane through one edge and an interior point of the opposite edge.
- id: OC-SIMPLEX-N-2MAP
  domain: R^n, n >= 3
  target: A full-dimensional n-simplex cut by a hyperplane
  map_count: 2
  status: RESEARCH_CHALLENGE_NOT_LEAN_VERIFIED
  canonical_subproblem: H = aff{M,v2,...,vn}, M in relint[v0,v1].
  embedded_variant: A literal tetrahedron in R^n remains three-dimensional.
