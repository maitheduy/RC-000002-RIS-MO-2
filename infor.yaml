limitations:
- Does not establish a new plane tiling class or aperiodicity.
- Does not formally prove Hausdorff convergence for arbitrary initial compact sets.
- The optimal Euclidean Lipschitz constant is in the written note, not the Lean theorem.
- Interior non-overlap is proved in the written note, not yet in Lean.
- Local kernel checking is not independent peer review or hosted CI.
challenge: Two-map contractive IFS for prescribed simplex partitions. Given any triangle ABC and an interior
  point M on AC, seek exactly two strict Euclidean affine contractions whose images are ABM and MBC. Extend
  the feasibility and construction problem to a tetrahedron cut by a plane and to a full-dimensional n-simplex
  in R^n, n >= 3. Classify admissible cuts, vertex assignments and contraction conditions; provide obstructions
  when the universal assertion fails. See OPEN_CHALLENGE.md for the full statement and qualifications.
