identifier_note: Final character O is the letter O, matching the author's requested name.
problem: Certify a prescribed four-map affine construction on a solid triangle.
claim: 'Define T = {(x,y) in R^2 : 0 <= x <= -y <= 1}.

  f1(x,y) = (-(x+y)/2, y/2)

  f2(x,y) = (-(x+y)/2, y/2 - 1/2)

  f3(x,y) = (-(x+y)/2 + 1/2, y/2 - 1/2)

  f4(x,y) = ((x+y)/2 + 1/2, -y/2 - 1).

  Each fi is a strict Euclidean contraction.

  T is nonempty, compact, and the unique nonempty compact set K satisfying

  K = f1(K) union f2(K) union f3(K) union f4(K).

  '
method:
- Ordered affine-frame matching
- Exact linear inequalities for coverage
- Squared Euclidean contraction estimate
- Two-step homothety and Hausdorff-distance uniqueness
